[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

# Moved from src-tauri/Cargo.toml: Cargo only allows [profile.*] at the workspace root.
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
